<!DOCTYPE html>
<html>
<head>
    <title>Register - StudyMate</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dbeafe, #ede9fe, #fce7f3);
        }

        .register-container {
            width: 90%;
            max-width: 440px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            border-top: 5px solid #6366f1;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #243b53;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.1);
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login a {
            color: #6366f1;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                <h1>📚 StudyMate</h1>
                <p>Personal Study Management System</p>
            </div>

            <div class="welcome">
                <p>Create your account and start organizing your studies.</p>
            </div>

            <form method="POST">

                <div class="form-group">

                    <label>Name:</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Email:</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password:</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <button type="submit" class="register-button">
                    📝 Create Account
                </button>

            </form>

            <div class="login">
                Already have an account?
                <a href="/login">Login here</a>
            </div>

        </div>

    </div>

</body>
</html>
